# DexAgent setup: the Unitree G1's two arms, each with a Unitree Dex1-1 parallel-jaw gripper, at a table.
# Generated by setup_g1_dex1/build_setup.py from vesoma-models robots/g1_with_dex1/g1_with_dex1.mujoco.xml; edit the generator, not this file.
# scene.xml is the floating-wrist planning representation, as in setup/. Physical episodes compile it with
# runtime_robot below: fixed flange-gripper body trees, bounded arm motor torques and the grippers' own jaw servos.
# Units: metres, radians, quaternions as [w, x, y, z]. Angles in degrees say so in the key name.

name: g1_dex1_bench
scene: scene.xml                     # table + the G1 torso and arms + both grippers, keyframe `home`, cameras `ego`, `wrist_left`, `wrist_right`

frame:                               # the rig frame every number below is in; Stage 2 places objects in it
  origin: midpoint of the two shoulder pitch joints, projected onto the tabletop
  x: toward the right arm
  y: into the work, away from the robot
  z: up
  tabletop_z: 0.0

table:
  body: table
  geom: g_table
  center: [0, 0.55, -0.02]
  half_extents: [0.6, 0.45, 0.02]
  work_area:                         # bounds of the 5 cm grid points where an arm holds its gripper pointing down with the
                                     # pad centre 5 cm above the table (build_setup.reach_grid); the G1 arm is short:
                                     # beyond y = 0.30 the gripper cannot point straight down
    left: {x: [-0.35, 0.15], y: [0.1, 0.3]}
    right: {x: [-0.15, 0.35], y: [0.1, 0.3]}
    both_arms: {x: [-0.15, 0.15], y: [0.1, 0.3]}

stations:                            # one G1 arm + one Dex1-1 each, both on the G1 torso
  left:
    arm: Unitree G1 left arm, 7 DOF (shoulder pitch, roll, yaw, elbow, wrist roll, pitch, yaw)
    hand: Unitree Dex1-1 parallel-jaw gripper, 2 jaw slides (one motor, coupled), left
    arm_xml: robot/g1_arm_left.xml
    base_body: robot_left_arm_root           # the G1 torso frame; both arms hang from it
    base_pos: [0, -0.0039563, 0.05222]
    base_quat_wxyz: [0.707107, 0, 0, 0.707107]
    shoulder_pos: [-0.10022, 0, 0.3]
    arm_joints: [robot_left_arm_shoulder_pitch_joint, robot_left_arm_shoulder_roll_joint, robot_left_arm_shoulder_yaw_joint, robot_left_arm_elbow_joint, robot_left_arm_wrist_roll_joint, robot_left_arm_wrist_pitch_joint, robot_left_arm_wrist_yaw_joint]
    flange_body: robot_left_arm_gripper           # the G1 wrist yaw link
    hand_root_body: robot_left_left_base_yaw        # the end effector Stage 3 and Stage 4 steer
    hand_xml: robot/dex1_left.xml
    wrist_joints: [robot_left_left_pos_x, robot_left_left_pos_y, robot_left_left_pos_z,
                   robot_left_left_rot_x, robot_left_left_rot_y, robot_left_left_rot_z]
    finger_joint_prefix: robot_left_left_
    jaw_joints: [robot_left_left_thumb_jaw, robot_left_left_index_jaw]   # coupled: index = thumb
    home_arm_rad: [0.737758, 0.821161, -0.421251, -0.141105, -0.534457, -0.701407, 0.288941]
    hand_mount_pos: [0.0415, 0, 0]       # the hand frame in the flange frame (the gripper casting's offset)
    hand_mount_quat_wxyz: [0.707107, 0, 0.707107, 0]
  right:
    arm: Unitree G1 right arm, 7 DOF (shoulder pitch, roll, yaw, elbow, wrist roll, pitch, yaw)
    hand: Unitree Dex1-1 parallel-jaw gripper, 2 jaw slides (one motor, coupled), right
    arm_xml: robot/g1_arm_right.xml
    base_body: robot_right_arm_root           # the G1 torso frame; both arms hang from it
    base_pos: [0, -0.0039563, 0.05222]
    base_quat_wxyz: [0.707107, 0, 0, 0.707107]
    shoulder_pos: [0.10021, 0, 0.3]
    arm_joints: [robot_right_arm_shoulder_pitch_joint, robot_right_arm_shoulder_roll_joint, robot_right_arm_shoulder_yaw_joint, robot_right_arm_elbow_joint, robot_right_arm_wrist_roll_joint, robot_right_arm_wrist_pitch_joint, robot_right_arm_wrist_yaw_joint]
    flange_body: robot_right_arm_gripper           # the G1 wrist yaw link
    hand_root_body: robot_right_right_base_yaw        # the end effector Stage 3 and Stage 4 steer
    hand_xml: robot/dex1_right.xml
    wrist_joints: [robot_right_right_pos_x, robot_right_right_pos_y, robot_right_right_pos_z,
                   robot_right_right_rot_x, robot_right_right_rot_y, robot_right_right_rot_z]
    finger_joint_prefix: robot_right_right_
    jaw_joints: [robot_right_right_thumb_jaw, robot_right_right_index_jaw]   # coupled: index = thumb
    home_arm_rad: [0.75033, -0.793949, 0.388956, -0.146746, 0.527833, -0.680762, -0.259696]
    hand_mount_pos: [0.0415, 0, 0]       # the hand frame in the flange frame (the gripper casting's offset)
    hand_mount_quat_wxyz: [0.707107, 0, 0.707107, 0]

robot:
  body_prefix: robot_                # every robot body, joint and geom starts with this
  attachment: fixed flange child in runtime  # structural attachment with zero relative DOF, never an equality weld
  hand_root_frame: flange in runtime; world in proposal
  hand_frame: +z along the jaws (the approach); jaws close along y
  actuators: 14 arm torque motors and 4 jaw position servos in runtime
  proposal_only: scene.xml virtual wrist joints and soft weld placeholders are for planning, never delivered physics
  nq: 30
  nu: 16
  reach: 0.562                       # shoulder pitch axis to the pad centre, sum of the link offsets

runtime_robot:
  schema: dexagent.rigid_robot.v1
  compiler: tool_library.common.rigid_robot.compile_rigid
  attachment: hand base_yaw is a fixed child of the arm's wrist yaw link; no wrist joints
  nq_empty_bench: 18                 # 14 physical arm joints + 4 jaw slides
  nu_empty_bench: 18                 # 14 arm motors + 4 jaw servos
  arm_control: bounded Cartesian impedance mapped through the Jacobian to motor torques, nullspace posture servo
  gravity_compensation: motor feedforward included inside the total motor torque cap
  arm_torque_cap_nm: [25, 25, 25, 25, 25, 5, 5]
  arm_posture_kp: [60, 60, 40, 40, 20, 8, 8]
  arm_posture_kd: [6, 6, 4, 4, 2, 0.8, 0.8]
  arm_params_source: custom fields dexagent_arm_*_<side> in scene.xml (rigid_robot.trusted_arms)
  arm_inertia_source: robot/g1_arm_<side>.xml
  armature_kg_m2: [0.00360972, 0.00360972, 0.00360972, 0.00360972, 0.00360972, 0.00425, 0.00425]
  motor_limit_source: vesoma-models robots/g1/_g1_common.xml actuatorfrcrange (Unitree G1 29-DoF)
  jaw_servo: position, kp 2000 N/m, kv 100 N s/m, force cap 20 N per jaw (vesoma-models _dex1_1.xml)
  jaw_coupling: equality robot_<side>_<side>_jaw_coupling, index_jaw = thumb_jaw (one motor on the real gripper)
  mount_source: flange-to-hand transforms at this scene's home keyframe
  recording: initial mjSTATE_INTEGRATION plus every physics substep state, control and mechanism state

home:                                # keyframe `home` in scene.xml
  keyframe: home
  description: both grippers resting low beside the work, 23 cm out to the sides, 6 cm in front of the shoulders and 8 cm above the table, jaws pointing into the work 10 deg down, jaws half open (46 mm); each arm at least 5 cm off the torso
  hand_root_pos:
    left: [-0.23, 0.06, 0.08]
    right: [0.23, 0.06, 0.08]

cameras:
  ego:                               # the G1's head camera (D435i colour); MuJoCo camera `ego`
    width: 640
    height: 480
    fovy_deg: 42.50
    focal_px: 617.2                  # = (height / 2) / tan(fovy / 2); fx = fy, principal point at the image centre
    pos: [-0.03253, 0.0536672, 0.48209]
    quat_wxyz: [0.932323, 0.361626, 6.64164e-07, -1.71231e-06]   # MuJoCo convention: the camera looks along its -z, y up
    pitch_deg: 47.60                 # of the optical axis, below horizontal
    yaw_deg: 90.00                   # of the optical axis, from +x; 90 is straight into the work
  wrist_left:                        # rigid to the hand root body; the source's Dex1-1 wrist camera
    parent_body: robot_left_left_base_yaw
    pos: [-0.051, 0, 0.072]
    quat_wxyz: [0.183013, 0.683013, -0.683013, -0.183013]
    fovy_deg: 83.58
  wrist_right:
    parent_body: robot_right_right_base_yaw
    pos: [-0.051, 0, 0.072]
    quat_wxyz: [0.183013, 0.683013, -0.683013, -0.183013]
    fovy_deg: 83.58

physics:
  timestep: 0.002
  integrator: implicitfast
  impratio: 5
